name: taxi-stack

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: taxi-jwt-compose-shared-secret-min-32-chars-ok!!
    depends_on:
      redis:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  vehicle-service:
    build: ./vehicle-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: taxi-jwt-compose-shared-secret-min-32-chars-ok!!
    depends_on:
      user-service:
        condition: service_healthy

  trip-service:
    build: ./trip-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: taxi-jwt-compose-shared-secret-min-32-chars-ok!!
    depends_on:
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      vehicle-service:
        condition: service_healthy

  rating-service:
    build: ./rating-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: taxi-jwt-compose-shared-secret-min-32-chars-ok!!
    depends_on:
      trip-service:
        condition: service_healthy

  favorite-places-service:
    build: ./favorite-places-service
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: taxi-jwt-compose-shared-secret-min-32-chars-ok!!
    depends_on:
      user-service:
        condition: service_healthy
