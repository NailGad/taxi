spring:
  application:
    name: vehicle-service
  datasource:
    url: jdbc:h2:mem:vehicle_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8084

user-service:
  url: http://localhost:8081

jwt:
  secret: ${JWT_SECRET:taxi-jwt-dev-secret-key-at-least-32-bytes!!}

logging:
  level:
    com.taxi: DEBUG
