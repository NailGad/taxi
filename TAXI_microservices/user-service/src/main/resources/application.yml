spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:user_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis

server:
  port: 8081

taxi:
  cache:
    available-drivers-ttl-seconds: 30

jwt:
  secret: ${JWT_SECRET:taxi-jwt-dev-secret-key-at-least-32-bytes!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

user-service:
  url: http://localhost:8081

notification-service:
  url: http://localhost:8083

logging:
  level:
    com.taxi: DEBUG