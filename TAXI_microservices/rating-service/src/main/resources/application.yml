spring:
  application:
    name: rating-service
  datasource:
    url: jdbc:h2:mem:rating_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8085

trip-service:
  url: http://localhost:8082

logging:
  level:
    com.taxi: DEBUG
